app = "iti-official-source-evidence"
primary_region = "iad"

[build]
  dockerfile = "autonomous_data_api/Dockerfile"

[env]
  AUTONOMOUS_API_BASE_URL = "https://evidence.regulavita.com"
  AUTONOMOUS_EVIDENCE_BACKGROUND_REFRESH = "1"
  AUTONOMOUS_EVIDENCE_DB_PATH = "/data/evidence.sqlite3"
  AUTONOMOUS_EVIDENCE_ENABLED = "1"
  AUTONOMOUS_EVIDENCE_REQUESTS_PER_MINUTE = "30"
  AUTONOMOUS_SOURCE_WATCH_ENABLED = "1"
  AUTONOMOUS_MONITOR_USER_AGENT = "Regulavita-Source-Watch/1.0 joshua@regulavita.com"
  AUTONOMOUS_SEC_USER_AGENT = "Regulavita-Official-Source-Evidence/0.4 joshua@regulavita.com"
  AUTONOMOUS_CONVERSION_EXPERIMENT_START_UTC = "2026-08-04T09:13:21Z"
  AUTONOMOUS_PROCUREMENT_EXPERIMENT_START_UTC = "2026-08-18T10:17:07Z"
  AUTONOMOUS_PYTHON_RUN_EXPERIMENT_START_UTC = "2026-08-21T10:21:30Z"
  AUTONOMOUS_PROCUREMENT_ENABLED = "1"
  AUTONOMOUS_PROCUREMENT_SUPPLIER_DAILY_CAP_USD = "0.20"
  AUTONOMOUS_X402_COMPANY_PROFILE_PRICE = "$0.25"
  AUTONOMOUS_X402_PYTHON_RUN_PRICE = "$0.03"
  AUTONOMOUS_LEGACY_FLY_HOST = "iti-official-source-evidence.fly.dev"
  AUTONOMOUS_X402_DAILY_REVENUE_CAP_USD = "10.00"
  AUTONOMOUS_X402_NETWORK = "eip155:8453"
  AUTONOMOUS_X402_FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
  AUTONOMOUS_X402_FORM_D_PRICE = "$0.05"
  AUTONOMOUS_X402_SOURCE_WATCH_PRICE = "$1.00"
  AUTONOMOUS_X402_PAY_TO = "0x9500075649a70411c81f99c4314f6cff55d12579"
  AUTONOMOUS_X402_SEC_PRICE = "$0.10"
  AUTONOMOUS_X402_SEC_SIGNAL_PRICE = "$0.01"
  AUTONOMOUS_X402_OFAC_PRICE = "$0.05"
  AUTONOMOUS_X402_OFAC_PREFLIGHT_PRICE = "$0.01"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "evidence_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
